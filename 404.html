<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Daham Bandara</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318191d'/%3E%3Ctext x='32' y='43' font-family='Georgia, serif' font-style='italic' font-weight='600' font-size='28' fill='%23ff5b3a' text-anchor='middle'%3EDB%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#18191d">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
  .not-found {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .not-found .code {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(4rem, 14vw, 8rem);
    color: var(--coral);
    line-height: 1;
  }
  .not-found h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin-top: 12px;
  }
  .not-found p {
    color: var(--text-dim);
    margin-top: 14px;
    max-width: 46ch;
  }
  .not-found .btn {
    margin-top: 32px;
  }
</style>
</head>
<body>

<div class="not-found">
  <span class="code">404</span>
  <h1>This page doesn't exist.</h1>
  <p>The link you followed might be broken, or the page may have moved. Let's get you back to the work that's actually here.</p>
  <a href="/" class="btn btn-solid">Back to the portfolio</a>
</div>

</body>
</html>
